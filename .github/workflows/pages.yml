# Publish the committed HTML edition (dist/html/) to GitHub Pages.
# No build happens here: run `make html` locally, commit dist/html, push.
name: Publish book

on:
  push:
    branches: [main]
    paths:
      - "dist/html/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:   # "Run workflow" button on the Actions tab

permissions:
  contents: read
  pages: write
  id-token: write

# Never cancel a deploy halfway; queue the next one instead.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist/html
      - id: deployment
        uses: actions/deploy-pages@v4
