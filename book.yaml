# Book manifest. Order here is the order of the book.
# kind: front (unnumbered, before Chapter 1) | chapter | appendix | back (unnumbered)
title: Where Things Live
subtitle: Data Structures in Modern C++
tagline: A ten-week text for CMSC 270 at Lawrence University
edition: First draft edition, Fall 2026
pdf_name: where-things-live.pdf

parts:
  - file: 00-preface.md
    kind: front
    blurb: "What this book is, the four questions it keeps asking, and how to learn with (and without) a language model."
  - file: 01-memory.md
    kind: chapter
    week: 1
    blurb: "C++ from the ground up. Objects are bytes; variables are places; pointers are addresses. The stack, the heap, and the tools that catch you when you fall."
  - file: 02-cost.md
    kind: chapter
    week: 2
    blurb: "Counting steps, growth rates, and Big-O. Binary search and its invariant. Measuring real programs, and the first hint that the machine has opinions."
  - file: 03-vector.md
    kind: chapter
    week: 3
    blurb: "We build std::vector. Class invariants, RAII, copying and moving, templates, iterators, amortized analysis, and a testing method we will reuse all term."
  - file: 04-links.md
    kind: chapter
    week: 4
    blurb: "The other way to arrange memory. Linked lists, stacks, queues, ring buffers, and an honest look at what caches do to pointer-chasing."
  - file: 05-hashing.md
    kind: chapter
    week: 5
    blurb: "The workhorse of modern software. Hash functions, chaining, open addressing, load factors, adversarial inputs, and Bloom filters."
  - file: 06-trees.md
    kind: chapter
    week: 6
    blurb: "Recursion as a habit of thought. Binary trees, traversals, binary search trees, ownership with unique_ptr, and the problem of shape."
  - file: 07-balance.md
    kind: chapter
    week: 7
    blurb: "Rotations and AVL trees, then the family: red-black trees, B-trees, and what an ordered map buys you that a hash table cannot."
  - file: 08-heaps-sorting.md
    kind: chapter
    week: 8
    blurb: "A tree that lives in an array. Priority queues, heapsort, mergesort, quicksort, the n log n barrier, and what std::sort really does."
  - file: 09-graphs.md
    kind: chapter
    week: 9
    blurb: "Relationships as data. Representations, breadth-first and depth-first search, Dijkstra's algorithm, and union-find."
  - file: 10-wild.md
    kind: chapter
    week: 10
    blurb: "Choosing and combining structures. LRU caches, tries, tokenizers, database indexes, Git, vector search, and what comes next."
  - file: a1-toolchain.md
    kind: appendix
    blurb: "Compiling, warnings, sanitizers, and reading the error messages."
  - file: a2-math.md
    kind: appendix
    blurb: "Logarithms, sums, induction, and a little probability."
  - file: a3-stl.md
    kind: appendix
    blurb: "Costs, invalidation rules, and idioms for the standard containers."
  - file: z1-colophon.md
    kind: back
    blurb: "How this book was made, and how far to trust it."
